# `RIPGREP_CONFIG_PATH` points `rg` here, so a recursive search skips the paths the `Read(...)` deny
# rules in `settings.json` cover. `read-deny-permissions.py` asks on every `rg` command until each
# denied name has a line here. See `README.md`.
# The filesystem ignores case, so the globs have to as well, or `Auth.json` gets through.
--glob-case-insensitive
--glob=!.aws
--glob=!.azure
--glob=!.boto
--glob=!**/.cargo/credentials
--glob=!**/.cargo/credentials.toml
--glob=!**/.circleci/cli.yml
--glob=!**/.composer/auth.json
--glob=!**/.config/configstore
--glob=!**/.config/doctl
--glob=!**/.config/gcloud
--glob=!**/.config/gh
--glob=!**/.config/glab-cli
--glob=!**/.config/hub
--glob=!**/.config/op
--glob=!**/.config/stripe
--glob=!.credentials.json
--glob=!.docker
--glob=!**/.gem/credentials
--glob=!.git-credentials
--glob=!.gnupg
--glob=!.kube
--glob=!.my.cnf
--glob=!.mylogin.cnf
--glob=!.netrc
--glob=!.npmrc
--glob=!.oci
--glob=!.password-store
--glob=!.pgpass
--glob=!.pypirc
--glob=!.s3cfg
--glob=!.ssh
--glob=!**/.terraform.d/credentials.tfrc.json
--glob=!.terraformrc
--glob=!.vault-token
--glob=!.wrangler
--glob=!.yarnrc.yml
--glob=!auth.json
--glob=!**/com.vercel.cli/auth.json
--glob=!**/composer/auth.json
--glob=!**/etc/shadow
--glob=!**/etc/sudoers
--glob=!**/git/credentials
--glob=!**/library/keychains
--glob=!**/netlify/config.json
--glob=!**/rclone/rclone.conf
--glob=!secrets.yaml
--glob=!secrets.yml
